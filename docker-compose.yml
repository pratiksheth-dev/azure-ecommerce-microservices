# Local development stack for the e-commerce microservices sample.
# Runs both services as containers; the Orders API reaches the Catalog API
# over the compose network at http://catalog-api:8080.
#
#   docker compose up --build
#   Catalog API -> http://localhost:5001
#   Orders API  -> http://localhost:5002

services:
  catalog-api:
    build:
      context: ./services/CatalogApi
    ports:
      - "5001:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development

  orders-api:
    build:
      context: ./services/OrdersApi
    ports:
      - "5002:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      # Overrides CatalogApi:BaseUrl from appsettings.json inside the stack.
      CatalogApi__BaseUrl: http://catalog-api:8080
    depends_on:
      - catalog-api
