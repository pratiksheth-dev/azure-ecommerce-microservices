name: Build Services and Validate Bicep

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build Catalog API
        run: dotnet build services/CatalogApi/CatalogApi.csproj --configuration Release
      - name: Build Orders API
        run: dotnet build services/OrdersApi/OrdersApi.csproj --configuration Release
      - name: Validate Bicep template
        run: |
          az bicep install
          az bicep build --file infra/main.bicep
